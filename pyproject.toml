[project]
name = "ffdraft"
version = "0.1.0"
description = "League-aware fantasy football draft board built on open NFL data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.0",
    "polars>=1.0",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyarrow>=25.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffdraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
